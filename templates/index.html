<!DOCTYPE html>
<!--
  templates/index.html
  ====================
  Chat UI for the Samphor Expert chatbot.

  Upgrades applied:
    Fix 5  — Quick reply chips after every bot response
    Fix 6  — Typing indicator ("..." animation) while server replies
    Fix 8  — localStorage persistence: chat survives a page refresh
    Fix 12 — Thumbs-up / thumbs-down feedback buttons on bot replies
    Fix 16 — Voice input via Web Speech API (hidden if browser unsupported)
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Samphor Expert System</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f1ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    header {
      background: #8b3a0f;
      color: #fff;
      padding: 18px 24px;
    }
    header h1 { font-size: 1.3rem; }
    header p  { font-size: 0.85rem; opacity: 0.8; margin-top: 2px; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #8b3a0f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #f0e6d3;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    /* ── Fix 6: Typing indicator ── */
    .typing-indicator {
      align-self: flex-start;
      background: #f0e6d3;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 18px;
      display: none;
      gap: 4px;
    }
    .typing-indicator span {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #8b3a0f;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Fix 12: Feedback buttons ── */
    .feedback-row {
      align-self: flex-start;
      display: flex;
      gap: 2px;
      margin-top: -2px;
    }
    .feedback-row .fb-btn {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0.3;
      padding: 2px 6px;
      border-radius: 8px;
      transition: opacity 0.15s, background 0.15s;
      line-height: 1;
    }
    .feedback-row .fb-btn:hover  { opacity: 0.9; background: #f0e6d3; }
    .feedback-row .fb-btn.active { opacity: 1; }
    .feedback-row.voted .fb-btn  { cursor: default; }

    /* ── Fix 5: Quick reply chips ── */
    .chips {
      align-self: flex-start;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 2px 0 4px;
    }
    .chips .chip {
      background: #fff;
      border: 1.5px solid #8b3a0f;
      color: #8b3a0f;
      border-radius: 16px;
      padding: 5px 13px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .chips .chip:hover {
      background: #8b3a0f;
      color: #fff;
    }

    /* ── Input row ── */
    .input-area {
      display: flex;
      padding: 14px 16px;
      border-top: 1px solid #eee;
      gap: 8px;
      background: #fafafa;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
    }
    #user-input:focus { border-color: #8b3a0f; }

    button {
      background: #8b3a0f;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #a84510; }

    #reset-btn    { background: #bbb; padding: 10px 14px; }
    #reset-btn:hover { background: #999; }

    #download-btn { background: #4a7c59; padding: 10px 14px; font-size: 1rem; }
    #download-btn:hover { background: #3a6347; }

    /* Fix 7: Rich media links */
    .media-links {
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 0 4px;
    }
    .media-link {
      font-size: 0.8rem;
      color: #5a6ea8;
      text-decoration: none;
    }
    .media-link:hover { text-decoration: underline; }

    /* Fix 16: Mic button */
    #mic-btn { background: #5a6ea8; padding: 10px 14px; font-size: 1rem; }
    #mic-btn:hover { background: #4a5e98; }
    #mic-btn.listening { background: #c0392b; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.6; }
    }
  </style>
</head>
<body>

<div class="chat-wrapper">

  <header>
    <h1>Samphor Expert System</h1>
    <p>Ask me anything about the traditional Cambodian drum</p>
  </header>

  <!-- Scrollable message area. JS populates this on load. -->
  <div id="chat-box">
    <!-- Fix 6: Typing indicator lives here, always last child -->
    <div id="typing" class="typing-indicator">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="input-area">
    <input id="user-input" type="text" placeholder="Ask about the Samphor..." autocomplete="off"/>
    <!-- Fix 16: Mic button (hidden by JS if browser doesn't support Speech API) -->
    <button id="mic-btn" title="Voice input">&#127908;</button>
    <button id="send-btn">Send</button>
    <button id="reset-btn" title="Reset session">&#8635;</button>
    <button id="download-btn" title="Download chat history">&#8659;</button>
  </div>

</div>

<script>
  const chatBox   = document.getElementById('chat-box');
  const typing    = document.getElementById('typing');
  const input     = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const resetBtn  = document.getElementById('reset-btn');
  const micBtn    = document.getElementById('mic-btn');

  const STORAGE_KEY   = 'samphor-chat-v1';
  const askedQuestions = new Set();   // tracks every message the user has sent

  // ── Fix 6: Typing indicator ──────────────────────────────────────────────
  function showTyping() {
    chatBox.appendChild(typing);          // keep it as last child
    typing.style.display = 'flex';
    chatBox.scrollTop = chatBox.scrollHeight;
  }
  function hideTyping() {
    typing.style.display = 'none';
  }

  // ── Message builders ─────────────────────────────────────────────────────
  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = text;
    chatBox.insertBefore(div, typing);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function addBotMessage(text, chips, media) {
    // Main reply bubble
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.textContent = text;
    chatBox.insertBefore(div, typing);

    // Fix 12: Feedback row
    const fbRow = document.createElement('div');
    fbRow.className = 'feedback-row';
    ['up', 'down'].forEach(vote => {
      const btn = document.createElement('button');
      btn.className = 'fb-btn';
      btn.title = vote === 'up' ? 'Helpful' : 'Not helpful';
      btn.textContent = vote === 'up' ? '👍' : '👎';
      btn.addEventListener('click', async () => {
        if (fbRow.classList.contains('voted')) return;
        fbRow.classList.add('voted');
        btn.classList.add('active');
        await fetch('/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vote, text }),
        }).catch(() => {});
      });
      fbRow.appendChild(btn);
    });
    chatBox.insertBefore(fbRow, typing);

    // Fix 5: Quick reply chips — filter out already-asked questions
    if (chips && chips.length) {
      const freshChips = chips.filter(c => !askedQuestions.has(c));
      const allAsked   = freshChips.length === 0;
      const toShow     = allAsked ? chips : freshChips;

      if (allAsked) {
        const notice = document.createElement('div');
        notice.className = 'msg bot';
        notice.style.cssText = 'font-size:0.82rem;opacity:0.75;font-style:italic;';
        notice.textContent = "You've explored all the suggested questions for this topic! Here they are again in case you'd like to revisit:";
        chatBox.insertBefore(notice, typing);
      }

      const chipsDiv = document.createElement('div');
      chipsDiv.className = 'chips';
      toShow.forEach(label => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = label;
        chip.addEventListener('click', () => {
          chipsDiv.remove();
          sendMessage(label);
        });
        chipsDiv.appendChild(chip);
      });
      chatBox.insertBefore(chipsDiv, typing);
    }

    // Fix 7: Rich media links
    if (media && media.links && media.links.length) {
      const linksDiv = document.createElement('div');
      linksDiv.className = 'media-links';
      media.links.forEach(({ label, url }) => {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'media-link';
        a.textContent = '🔗 ' + label;
        linksDiv.appendChild(a);
      });
      chatBox.insertBefore(linksDiv, typing);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // ── Fix 8: localStorage persistence ──────────────────────────────────────
  function saveToStorage() {
    const msgs = [...chatBox.querySelectorAll('.msg')].map(m => ({
      role: m.classList.contains('user') ? 'user' : 'bot',
      text: m.textContent.trim(),
    }));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs)); } catch(e) {}
  }

  function loadFromStorage() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return false;
      const msgs = JSON.parse(saved);
      if (!msgs.length) return false;
      msgs.forEach(({ role, text }) => {
        if (role === 'user') {
          addUserMessage(text);
          askedQuestions.add(text);   // rebuild tracking from saved history
        } else {
          addBotMessage(text, [], null);   // no chips/media for restored messages
        }
      });
      return true;
    } catch(e) { return false; }
  }

  function clearStorage() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  }

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMessage(overrideText) {
    const text = typeof overrideText === 'string' ? overrideText : input.value.trim();
    if (!text) return;

    askedQuestions.add(text);   // remember every question sent
    addUserMessage(text);
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      hideTyping();
      addBotMessage(data.response, data.chips || [], data.media || null);
      saveToStorage();
    } catch(err) {
      hideTyping();
      addBotMessage('Error connecting to the server. Please try again.', []);
    } finally {
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  // ── Download history ──────────────────────────────────────────────────────
  function downloadHistory() {
    const messages = chatBox.querySelectorAll('.msg');
    if (!messages.length) { alert('No chat history to download yet.'); return; }
    const lines = [];
    const now = new Date().toLocaleString();
    lines.push('Samphor Expert System — Chat History');
    lines.push('Downloaded: ' + now);
    lines.push('='.repeat(50));
    lines.push('');
    messages.forEach(msg => {
      const role = msg.classList.contains('user') ? 'You' : 'Samphor Expert';
      lines.push(role + ': ' + msg.textContent.trim());
      lines.push('');
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const ts   = new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
    const a    = document.createElement('a');
    a.href = url; a.download = 'samphor-chat-' + ts + '.txt';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  document.getElementById('download-btn').addEventListener('click', downloadHistory);

  // ── Reset ────────────────────────────────────────────────────────────────
  resetBtn.addEventListener('click', async () => {
    const res  = await fetch('/reset', { method: 'POST' });
    const data = await res.json();
    [...chatBox.querySelectorAll('.msg, .feedback-row, .chips')].forEach(el => el.remove());
    clearStorage();
    askedQuestions.clear();   // reset chip tracking for new session
    addBotMessage(data.greeting, [], null);
  });

  // ── Fix 16: Voice input ───────────────────────────────────────────────────
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    micBtn.style.display = 'none';
  } else {
    const rec = new SpeechRec();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.onresult = e => {
      input.value = e.results[0][0].transcript;
      micBtn.classList.remove('listening');
      input.focus();
    };
    rec.onend  = () => micBtn.classList.remove('listening');
    rec.onerror = () => micBtn.classList.remove('listening');
    micBtn.addEventListener('click', () => {
      if (micBtn.classList.contains('listening')) {
        rec.stop();
      } else {
        rec.start();
        micBtn.classList.add('listening');
      }
    });
  }

  // ── Init: restore saved chat or show fresh greeting ───────────────────────
  if (!loadFromStorage()) {
    addBotMessage(
      'Hello! I am the Samphor Expert — your guide to Cambodia\'s iconic drum. Before we dive in, may I know your name?',
      [], null
    );
  }
</script>
</body>
</html>
